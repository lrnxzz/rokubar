<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 256 256">
  <!-- The mark drawn for 16 to 48 px: a chubbier remote with a bright rim, a large cross, no small keys and one bold wave. -->
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5a5a64"/>
      <stop offset="0.45" stop-color="#2a2a30"/>
      <stop offset="1" stop-color="#131316"/>
    </linearGradient>
    <linearGradient id="pad" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#a06cff"/>
      <stop offset="1" stop-color="#5b1fd0"/>
    </linearGradient>
    <linearGradient id="tag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8d4dff"/>
      <stop offset="1" stop-color="#5418c4"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#8b4cff"/>
      <stop offset="1" stop-color="#c7a2ff"/>
    </linearGradient>
    <path id="cross" d="M -28 -104 H 28 A 24 24 0 0 1 52 -80 V -70 A 18 18 0 0 0 70 -52 H 80 A 24 24 0 0 1 104 -28 V 28 A 24 24 0 0 1 80 52 H 70 A 18 18 0 0 0 52 70 V 80 A 24 24 0 0 1 28 104 H -28 A 24 24 0 0 1 -52 80 V 70 A 18 18 0 0 0 -70 52 H -80 A 24 24 0 0 1 -104 28 V -28 A 24 24 0 0 1 -80 -52 H -70 A 18 18 0 0 0 -52 -70 V -80 A 24 24 0 0 1 -28 -104 Z"/>
  </defs>

  <g transform="translate(96 146) rotate(36) scale(0.92)">
    <path d="M -26 92 H 26 V 142 L 0 128 L -26 142 Z" fill="url(#tag)"/>
    <rect x="-54" y="-112" width="108" height="214" rx="54" fill="url(#shell)"/>
    <rect x="-54" y="-112" width="108" height="214" rx="54" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="8"/>
    <circle cx="0" cy="-72" r="16" fill="#ff3b45"/>
    <use xlink:href="#cross" transform="translate(0 4) scale(0.46)" fill="url(#pad)"/>
    <circle cx="0" cy="4" r="13" fill="#4a16b0"/>
  </g>

  <path d="M 162 18 A 52 52 0 0 1 206 76" fill="none" stroke="url(#wave)" stroke-linecap="round" stroke-width="28"/>
</svg>
